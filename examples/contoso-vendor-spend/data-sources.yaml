# Data sources for the Contoso Vendor Spend agent.
# A Fabric Data Agent supports up to 5 sources (combinable). This example uses one:
# a Power BI semantic model (NL2DAX). See docs/anatomy/02-data-sources.md.

sources:
  - type: semantic-model          # NL -> DAX
    name: "Contoso Vendor Spend (SM)"
    id: "<semantic-model-id>"     # placeholder — real value is a GUID
    # Prep-for-AI (descriptions, example values, verified queries) is configured
    # on the MODEL itself, not here. See docs/anatomy/04-source-instructions-and-fewshots.md.
    tables:
      - factspend
      - CALENDAR
      - dimbusinessunit
      - dimjobfamily
      - dimlocation
      - dimspendtype
      - dimsupplier
      - dimcostcenter
